services:
  web:
    build: .
    env_file: .env/config.env
    ports:
      - "${HOST_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/src
      - go_mod_cache:/tmp/go-mod
      - go_build_cache:/tmp/go-build

    entrypoint: []
    command: ["go", "run", "./cmd/api"]
    environment:
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod

  migrate:
    image: migrate/migrate:v4.20.1
    env_file: .env/config.env
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${POSTGRES_DB:?POSTGRES_DB is required}"
        : "$${POSTGRES_TEST_DB:?POSTGRES_TEST_DB is required}"
        for database in "$${POSTGRES_DB}" "$${POSTGRES_TEST_DB}"; do
          echo "Applying migrations to $${database}"
          migrate -path=/migrations \
            -database="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:5432/$${database}?sslmode=disable" up
        done

  postgres:
    image: postgres:18.7
    env_file: .env/config.env
    command: ["postgres", "-c", "synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-on}"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:2.4.0
    profiles: ["load"]
    working_dir: /scripts
    volumes:
      - ./tests/load:/scripts:ro
    environment:
      BASE_URL: "http://web:${SERVER_PORT}"

volumes:
  go_build_cache:
  go_mod_cache:
  postgres_data:
